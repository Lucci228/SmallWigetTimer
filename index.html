<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/src/styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tauri App</title>
        <script type="module" src="/src/main.ts" defer></script>
    </head>

    <body>
        <main class="flex-container" id="main">
            <header class="title-container header" id="title-container">
                <img class="cat-logo" src="src-tauri/icons/128x128@2x.png" />
                <h1 class="page-title" id="title-text">
                    Beb Moment in Progress
                </h1>
                <div class="header-btns">
                    <button class="settings-btn" id="settings-btn" title="Set timer length">⚙</button>
                    <button class="settings-btn" id="pause-btn" title="Pause timer"><img src="src/assets/pause.png"></button>
                </div>

            </header>
            <div class="body-container content" id="body-main">
                <dialog class="select-timer" id="timer-dialog">
                    <h2 class="dialog-title" id="dialog-title">Choose timer length</h2>
                    <div class="timer-options">
                        <div class = "timer-options-content">
                            <div class = "gamble-card">
                                 <div class="gamble-header-text">Hours</div>
                                 <div class = "timer-gamble-slot">
                                     <div class = "gamble-text" id="gamble-hour">0</div>
                                 </div>
                            </div>
                            <div class="gamble-separator">:</div>
                            <div class = "gamble-card">
                                 <div class="gamble-header-text">Minutes</div>
                                 <div class = "timer-gamble-slot">
                                     <div class = "gamble-text" id="gamble-minute">0</div>
                                 </div>
                            </div>
                            <div class="gamble-separator">:</div>
                            <div class = "gamble-card">
                                 <div class="gamble-header-text">Seconds</div>
                                 <div class = "timer-gamble-slot">
                                     <div class = "gamble-text" id="gamble-second">0</div>
                                 </div>
                            </div>
                        </div>
                    </div>
                    <div class = "dialog-timer-container">
                        <div class = "glow-bg"><button class="dialog-close-btn" id="dialog-gamble-btn">Gamble</button></div>
                        <button class="dialog-close-btn" id="dialog-confirm-btn">Confirm</button>
                        <button class="dialog-close-btn" id="dialog-cancel-btn">Cancel</button>
                    </div>
                </dialog>
                <div class="loading-cat" id="load-cat">
                    <div class="body"></div>
                    <div class="head">
                        <div class="face"></div>
                    </div>
                    <div class="foot">
                        <div class="tummy-end"></div>
                        <div class="bottom"></div>
                        <div class="legs left"></div>
                        <div class="legs right"></div>
                    </div>
                    <div class="hands left"></div>
                    <div class="hands right"></div>
                </div>
                <div class="timer-cat hidden" id="cat-container">
                    <img
                        class="dance-cat"
                        id="dance-cat"
                        src="src/assets/cat-cute.gif"
                    />
                </div>
                <div class="sleep-cat-container hidden" id="sleep-cat">
                    <img class="sleep-cat" src="src/assets/sleepy.gif"/>
                </div>
                <div class="loading-text">
                    <p id="loading-text"></p>
                    <div class="rage-hover">
                        <button
                            class="rage-hover cool-btn hidden"
                            id="popup-btn"
                        ></button>
                    </div>
                </div>
                <audio loop id="myAudio">
                    <source src="src/assets/slots.wav" type="audio/wav" />
                </audio>
            </div>
        </main>
    </body>
</html>
